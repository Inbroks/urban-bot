name: UO Jaded London monitor

on:
  schedule:
    # Каждые 30 минут с 7:00 до 1:30 по Москве. Время в cron — UTC (МСК = UTC+3):
    # часы 4–22 UTC = 7:00–1:59 МСК, то есть с 2:00 до 7:00 МСК проверок нет.
    - cron: "*/30 4-22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run — обычная проверка; test — прислать в Telegram текущие скидки"
        type: choice
        options: [run, test]
        default: run

permissions:
  contents: write                # чтобы сохранять state.json в репозиторий

concurrency:
  group: uo-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check site
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}      # с 1 по 15 число
          FIRECRAWL_API_KEY_2: ${{ secrets.FIRECRAWL_API_KEY_2 }}  # с 16 до конца месяца
          PROXY_URL: ${{ secrets.PROXY_URL }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
        run: python -m uo_monitor

      - name: Save state
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then echo "state не изменился"; exit 0; fi
          git commit -m "Update state [skip ci]"
          for i in 1 2 3; do
            # -X theirs: при конфликте оставляем только что посчитанный state
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
